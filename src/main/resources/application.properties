spring.application.name=financeiro-api

# Server
server.port=${PORT:8080}

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/financeiro}
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASS:secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
# dialect auto-detectado pelo Hibernate — não precisa declarar explicitamente
spring.jpa.open-in-view=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# JWT — JWT_SECRET obrigatório em produção (mínimo 48 chars para HMAC-SHA384)
app.jwt.secret=${JWT_SECRET:financeiro-saas-very-long-secret-key-for-jwt-signing-2024-dev-only}
app.jwt.expiration=${JWT_EXPIRATION:900000}
app.jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}

# Multipart (CSV upload)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000}

# Email (Resend HTTP API — configure RESEND_API_KEY e MAIL_FROM no ambiente)
# RESEND_API_KEY=re_xxxxxxxxxxxxxxx
# MAIL_FROM=noreply@seudominio.com
# APP_URL=https://finance-api-web.vercel.app
app.url=${APP_URL:http://localhost:3000}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha

# Platform admin seed (created on first startup if no PLATFORM_ADMIN exists)
app.platform.admin.email=${PLATFORM_ADMIN_EMAIL:admin@plataforma.com}
app.platform.admin.password=${PLATFORM_ADMIN_PASSWORD:admin@1234}
