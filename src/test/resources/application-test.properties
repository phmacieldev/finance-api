# Flyway e JPA usam o DataSource do Testcontainers via @ServiceConnection
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Desabilita SMTP nos testes
spring.mail.host=
SMTP_AUTH=false
SMTP_TLS=false

# JWT
app.jwt.secret=test-secret-key-financeiro-saas-integration-tests-long-enough
app.jwt.expiration=86400000

app.url=http://localhost:3000
app.platform.admin.email=admin@plataforma.com
app.platform.admin.password=admin@1234
